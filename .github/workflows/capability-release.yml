name: Capability release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag used by catalog URLs
        required: true
        type: string
      signing_key_id:
        description: Public key ID already committed to capabilities/trusted-keys.json
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: GitHub release tag used by catalog URLs
        required: true
        type: string
      signing_key_id:
        description: Public key ID already committed to capabilities/trusted-keys.json
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: capability-release-${{ inputs.release_tag }}
  cancel-in-progress: false

# Batch 0 deliberately quarantines the legacy five-pack release matrix. Batch 8
# must replace this blocker with manifest-derived staging and qualification jobs;
# until then no distributable catalog can be produced from incomplete assets.
jobs:
  release-blocker:
    name: Validate the product matrix and keep distributable release disabled
    runs-on: ubuntu-24.04
    environment: capability-release
    steps:
      - name: Checkout exact default-branch commit with release history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.1

      - name: Require the canonical repository, exact coordinate, and manifest-derived matrix
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'StoneLL1/llm-wiki-desktop'
          node scripts/check-release-version.mjs --tag "$RELEASE_TAG"
          node scripts/verify-product-capabilities.mjs --print-matrix
          node scripts/verify-product-capabilities.mjs --require-release-ready
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"

      - name: Refuse distributable capability publication until Batch 8 activates every manifest entry
        run: |
          echo "Capability publication remains quarantined until Batch 8 supplies manifest-derived staging and real qualification evidence." >&2
          exit 1
