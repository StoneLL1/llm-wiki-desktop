name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validation:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frozen release identity
        run: npm run check:release-config

      - name: Check final-four redline declarations
        run: npm run test:final-four-redlines

      - name: Check Import and Source acceptance evidence
        run: npm run check:import-source-media

      - name: Run frontend tests
        run: npm run test

      - name: Run capability tool and platform parser tests
        run: npm run test:capability-tools

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Check console logging
        run: npm run check:console

      - name: Check Tauri GUI Rust compile
        run: npm run check:rust:gui

      - name: Run Rust service tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features
