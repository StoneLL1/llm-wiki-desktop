name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validation:
    # Keep these names stable: master branch protection requires them.
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.1
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.92.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev

      - name: Install test dependencies
        run: npm ci

      - name: Run full check on Linux
        if: runner.os == 'Linux'
        run: npm run check

      - name: Check native compilation on Windows and macOS
        if: runner.os != 'Linux'
        run: npm run check:rust:gui

      - name: Test native services on Windows and macOS
        if: runner.os != 'Linux'
        # Linux covers the four exhaustive crash/format/scale sweeps in full.
        run: npm run test:rust:platform

      - name: Test platform capability runners
        if: runner.os != 'Linux'
        run: npm run test:capability-tools

  auto-rerun:
    # GitHub-hosted Linux runners occasionally receive a shutdown signal
    # mid-job (the step dies with exit 143 while other platforms pass).
    # Retry once when only the Linux job failed, so an infrastructure kill
    # does not block the PR. Real failures on any platform are never
    # retried automatically and stay visible as red checks.
    name: Auto-rerun on Linux runner shutdown
    needs: validation
    if: failure() && github.run_attempt < 2
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-run failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          FAILED_JOBS=$(gh api "repos/$GH_REPO/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs" \
            --paginate --jq '.jobs[] | select(.conclusion == "failure") | .name')
          echo "Failed jobs: $FAILED_JOBS"
          if [ "$FAILED_JOBS" != "Validate (ubuntu-latest)" ]; then
            echo "Not a Linux-only failure; no automatic rerun."
            exit 0
          fi
          gh api --method POST "repos/$GH_REPO/actions/runs/${{ github.run_id }}/rerun-failed-jobs" \
            -f enable_debug_logging=false > /dev/null
          echo "Automatic rerun requested."
