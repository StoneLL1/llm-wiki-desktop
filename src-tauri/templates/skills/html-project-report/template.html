<!doctype html>
<!--
  html-project-report — styling reference only.
  Whole-wiki report visual treatment. No schema/lint/agent behavior.
-->
<html lang="">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <style>
      :root {
        --bg: #ffffff;
        --ink: #1a1a1a;
        --muted: #6b7280;
        --hairline: #e5e7eb;
        --accent: #0d9488;
        --surface: #f7f7f8;
      }
      body {
        margin: 0 auto;
        max-width: 880px;
        padding: 48px 28px 96px;
        color: var(--ink);
        font-family: Inter, system-ui, -apple-system, sans-serif;
        font-size: 15px;
        line-height: 1.6;
      }
      header {
        border-bottom: 1px solid var(--hairline);
        padding-bottom: 20px;
        margin-bottom: 32px;
      }
      header h1 {
        font-size: 28px;
        margin: 0 0 8px;
      }
      header .purpose {
        color: var(--muted);
      }
      h2 {
        font-size: 18px;
        margin-top: 2.2em;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--hairline);
      }
      .group h3 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin: 1.4em 0 0.4em;
      }
      ul {
        padding-left: 18px;
        margin: 0 0 12px;
      }
      li {
        margin-bottom: 4px;
      }
      .path {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 12px;
        color: var(--muted);
      }
      .note {
        background: var(--surface);
        border: 1px solid var(--hairline);
        border-radius: 8px;
        padding: 12px 14px;
        margin-bottom: 10px;
      }
      .note strong {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>{{title}}</h1>
      <div class="purpose">{{purpose}}</div>
    </header>

    <section class="group">
      <h2>Index by type</h2>
      {{indexByType}}
    </section>

    <section>
      <h2>Highlights</h2>
      {{highlights}}
    </section>

    <section>
      <h2>Structural notes</h2>
      {{structuralNotes}}
    </section>
  </body>
</html>
