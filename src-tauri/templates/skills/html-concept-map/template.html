<!doctype html>
<!--
  html-concept-map — styling reference only.
  Static inline-SVG concept map. No schema/lint/agent behavior, no scripts.
-->
<html lang="">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <style>
      :root {
        --bg: #ffffff;
        --ink: #1a1a1a;
        --muted: #6b7280;
        --hairline: #d1d5db;
        --accent: #0d9488;
        --node: #f7f7f8;
      }
      body {
        margin: 0;
        padding: 24px;
        background: var(--bg);
        font-family: Inter, system-ui, -apple-system, sans-serif;
        color: var(--ink);
      }
      header {
        margin-bottom: 16px;
      }
      header h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      header p {
        margin: 0;
        font-size: 12px;
        color: var(--muted);
      }
      svg {
        width: 100%;
        height: 70vh;
        border: 1px solid var(--hairline);
        border-radius: 8px;
        background: var(--bg);
      }
      .edge {
        stroke: var(--hairline);
        stroke-width: 1;
      }
      .node rect {
        fill: var(--node);
        stroke: var(--hairline);
        stroke-width: 1;
      }
      .node rect.centre {
        fill: #e6f4f1;
        stroke: var(--accent);
        stroke-width: 1.5;
      }
      .node text {
        font-size: 12px;
        fill: var(--ink);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>{{title}}</h1>
      <p>{{subtitle}}</p>
    </header>
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
      <!--
        Replace with generated static SVG: <line class="edge"> connections and
        <g class="node"> groups (a <rect> + <text>) positioned around the centre.
      -->
      {{svgBody}}
    </svg>
  </body>
</html>
