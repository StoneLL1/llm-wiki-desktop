<!doctype html>
<!--
  html-beautiful-read — styling reference only.
  This template defines the visual treatment for a single-page long-form read.
  It does not encode schema, lint, or agent behavior. Fill {{...}} regions with
  generated content; keep all CSS inline in the <style> block.
-->
<html lang="">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <style>
      :root {
        --bg: #ffffff;
        --ink: #1a1a1a;
        --muted: #6b7280;
        --hairline: #e5e7eb;
        --accent: #0d9488;
        --code-bg: #f7f7f8;
      }
      html {
        background: var(--bg);
      }
      body {
        margin: 0 auto;
        max-width: 70ch;
        padding: 48px 24px 96px;
        color: var(--ink);
        font-family: "Source Serif Pro", Georgia, "Times New Roman", serif;
        font-size: 18px;
        line-height: 1.7;
      }
      header {
        border-bottom: 1px solid var(--hairline);
        margin-bottom: 32px;
        padding-bottom: 20px;
      }
      header h1 {
        font-size: 32px;
        line-height: 1.2;
        margin: 0 0 8px;
      }
      header .source {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 12px;
        color: var(--muted);
      }
      h2,
      h3,
      h4 {
        line-height: 1.3;
        margin-top: 1.8em;
      }
      h2 {
        font-size: 22px;
      }
      h3 {
        font-size: 18px;
      }
      a {
        color: var(--accent);
      }
      blockquote {
        border-left: 3px solid var(--accent);
        margin: 1.4em 0;
        padding: 0.2em 1em;
        color: var(--muted);
      }
      code {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 0.9em;
        background: var(--code-bg);
        padding: 1px 5px;
        border-radius: 4px;
      }
      pre {
        background: var(--code-bg);
        padding: 16px;
        border-radius: 8px;
        overflow-x: auto;
      }
      pre code {
        background: none;
        padding: 0;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        border: 1px solid var(--hairline);
        padding: 8px 10px;
        text-align: left;
      }
      hr {
        border: none;
        border-top: 1px solid var(--hairline);
        margin: 2em 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>{{title}}</h1>
      <div class="source">{{sourcePath}}</div>
    </header>
    <article>
      {{body}}
    </article>
  </body>
</html>
