[package]
name = "llm-wiki-desktop"
version = "0.1.0"
description = "Local-first desktop app for turning personal sources into a Markdown wiki."
authors = ["LLM Wiki Desktop Contributors"]
edition = "2021"

[lib]
name = "llm_wiki_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[features]
default = ["gui"]
gui = ["dep:tauri", "dep:tauri-plugin-notification", "dep:tauri-build"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-notification = { version = "2", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
