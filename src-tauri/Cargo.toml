[package]
name = "llm-wiki-desktop"
version = "0.1.0"
description = "Local-first desktop app for turning personal sources into a Markdown wiki."
authors = ["LLM Wiki Desktop Contributors"]
edition = "2021"

[lib]
name = "llm_wiki_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[features]
default = ["gui"]
gui = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-notification", "dep:tauri-build"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
sha2 = "0.10"
ring = "0.17"
semver = "1"
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
pdf-extract = "0.10"
lopdf = { version = "0.38", default-features = false }
quick-xml = "0.36"
zip = { version = "2", default-features = false, features = ["deflate"] }
unicode-normalization = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
