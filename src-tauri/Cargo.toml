[package]
name = "llm-wiki-desktop"
version = "0.1.0"
description = "Local-first desktop app for turning personal sources into a Markdown wiki."
authors = ["LLM Wiki Desktop Contributors"]
license = "Apache-2.0"
edition = "2021"
default-run = "llm-wiki-desktop"

[lib]
name = "llm_wiki_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-build = { version = "2", features = [], optional = true }

[features]
default = ["gui"]
gui = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-notification", "dep:tauri-plugin-updater", "dep:tauri-build"]
performance-observers = []

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
dirs = "6"
encoding_rs = "0.8"
futures-util = "0.3"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
sha2 = "0.10"
md-5 = "0.11"
minisign-verify = "0.2"
ring = "0.17"
semver = "1"
same-file = "1.0"
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
pdf-extract = "0.10"
lopdf = { version = "0.38", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
quick-xml = "0.36"
zip = { version = "2", default-features = false, features = ["deflate"] }
unicode-normalization = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = { version = "=2.9.0", path = "vendor/tauri-plugin-updater", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[profile.test]
# Preserve line-level backtraces without generating full Windows PDB debug data
# for every integration-test binary.
debug = 1
