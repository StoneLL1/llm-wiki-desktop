<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM Wiki Desktop</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("llm-wiki-desktop.theme") || "auto";
          document.documentElement.dataset.theme = theme;
        } catch (_error) {
          document.documentElement.dataset.theme = "auto";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
